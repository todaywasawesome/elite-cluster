# GitHub Actions Runner Controller (ARC), scale-set mode. Only watches clarastack-ci.
apiVersion: argoproj.io/v1alpha1
kind: Application
metadata:
  name: arc-controller
  namespace: argocd
spec:
  destination:
    namespace: arc-systems
    server: https://kubernetes.default.svc
  project: default
  source:
    repoURL: 'https://github.com/todaywasawesome/elite-cluster'
    targetRevision: HEAD
    path: user/manifests/arc-controller/elite-cluster
  syncPolicy:
    automated: {}
    syncOptions:
    - CreateNamespace=true
    - ServerSideApply=true
