# Kata Containers: pods with runtimeClassName "kata" run in their own lightweight VM.
apiVersion: argoproj.io/v1alpha1
kind: Application
metadata:
  name: kata-containers
  namespace: argocd
spec:
  destination:
    namespace: kata-system
    server: https://kubernetes.default.svc
  project: default
  source:
    repoURL: 'https://github.com/todaywasawesome/elite-cluster'
    targetRevision: HEAD
    path: user/manifests/kata-containers/elite-cluster
  syncPolicy:
    automated: {}
    syncOptions:
    - CreateNamespace=true
    - ServerSideApply=true
