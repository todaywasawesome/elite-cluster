# Clarastack CI: ephemeral GitHub Actions runner pods for clarastack-com/controlplane and
# clarastack-com/desktop (org runner group "homelab"). Synthetic data only, no secrets
# in jobs (Clarastack decision D-05). Depends on arc-controller for the CRDs.
apiVersion: argoproj.io/v1alpha1
kind: Application
metadata:
  name: clarastack-ci
  namespace: argocd
spec:
  destination:
    namespace: clarastack-ci
    server: https://kubernetes.default.svc
  project: default
  source:
    repoURL: 'https://github.com/todaywasawesome/elite-cluster'
    targetRevision: HEAD
    path: user/manifests/clarastack-ci/elite-cluster
  syncPolicy:
    automated: {}
    syncOptions:
    - CreateNamespace=true
    - ServerSideApply=true
    - SkipDryRunOnMissingResource=true
