gha-runner-scale-set:
  githubConfigUrl: https://github.com/clarastack-com
  # Made by templates/external-secret.yaml from 1Password.
  githubConfigSecret: clarastack-arc-app
  runnerGroup: homelab
  # Workflows select this with the repo variable LINUX_RUNNER=clarastack-homelab-linux.
  runnerScaleSetName: clarastack-homelab-linux
  minRunners: 0
  maxRunners: 2

  controllerServiceAccount:
    namespace: arc-systems
    name: arc-gha-rs-controller

  # No containerMode: no Docker-in-Docker, nothing privileged. Every job gets a new pod
  # that is deleted afterwards.
  template:
    spec:
      # Each job runs in its own Kata VM with its own kernel, so a kernel exploit in a job
      # lands in a throwaway guest, not on the node. Also lets Chromium (CEF) create the
      # user namespaces its sandbox needs, inside the guest only.
      runtimeClassName: kata
      automountServiceAccountToken: false
      enableServiceLinks: false
      priorityClassName: clarastack-ci-low
      securityContext:
        runAsNonRoot: true
        runAsUser: 1001
        runAsGroup: 1001
        fsGroup: 1001
        seccompProfile:
          type: RuntimeDefault
      containers:
      - name: runner
        # Clarastack runner image (controlplane ci/runner-image): Ubuntu 22.04, the runner,
        # build tools and Xvfb preinstalled, no sudo. Pinned by digest; bump with the image.
        image: ghcr.io/clarastack-com/ci-runner-linux:2.338.2-20261123@sha256:a006d464339e5def23fc4678e687026e17fbb7468a89a0f2a90a3343b0ee12fc
        command: ["/home/runner/run.sh"]
        securityContext:
          allowPrivilegeEscalation: false
          capabilities:
            drop: ["ALL"]
        resources:
          requests:
            cpu: "2"
            memory: 6Gi
            ephemeral-storage: 20Gi
          limits:
            cpu: "3"
            memory: 10Gi
            ephemeral-storage: 40Gi
