# GitHub App "clarastack-homelab-runners": org permission Self-hosted runners (read and
# write) only, installed on controlplane and desktop. The private key stays in 1Password.
apiVersion: external-secrets.io/v1
kind: ExternalSecret
metadata:
  name: clarastack-arc-app
spec:
  secretStoreRef:
    kind: ClusterSecretStore
    name: k8s
  target:
    name: clarastack-arc-app
    creationPolicy: Owner
    template:
      engineVersion: v2
      data:
        github_app_id: "5896627"
        github_app_installation_id: "INSTALLATION_ID"
        github_app_private_key: "{{ .private_key }}"
  data:
  - secretKey: private_key
    remoteRef:
      # 1password-entry-name
      key: "clarastack-homelab-runners"
      # 1password-field
      property: private-key
